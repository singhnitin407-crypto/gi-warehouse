document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

verflow:hidden;transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease);min-width:0;cursor:pointer}\n.gi-pcard:hover,.gi-pcard.is-hover{box-shadow:var(--shadow-raised)}\n.gi-pcard:focus-within,.gi-pcard.is-focus{outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-offset)}\n.gi-pcard:active,.gi-pcard.is-pressed{box-shadow:none;border-color:var(--gi-navy)}\n.gi-pcard.is-selected{border-color:var(--border-selected);box-shadow:inset 0 0 0 1px var(--border-selected)}\n.gi-pcard.is-selected:hover{box-shadow:inset 0 0 0 1px var(--border-selected),var(--shadow-raised)}\n.gi-pcard.is-disabled{cursor:not-allowed}\n.gi-pcard.is-disabled:hover{box-shadow:none}\n.gi-pcard__media{aspect-ratio:1/1;background:var(--gi-white);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border-default);position:relative}\n.gi-pcard__media img{width:100%;height:100%;object-fit:contain;padding:16px}\n.gi-pcard__ph{position:absolute;inset:16px;border:1px dashed var(--border-default);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;text-align:center;font:var(--type-label);letter-spacing:var(--type-label-tracking);text-transform:uppercase;color:var(--text-secondary);padding:8px}\n.gi-pcard__body{display:flex;flex-direction:column;gap:8px;padding:16px;flex:1}\n.gi-pcard__job{font:var(--type-label);letter-spacing:var(--type-label-tracking);text-transform:uppercase;color:var(--gi-navy)}\n.gi-pcard__name{font:var(--type-body-strong);color:var(--text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:52px;margin:0}\n.gi-pcard__pack{font:var(--type-small);color:var(--text-secondary)}\n.gi-pcard__price{font:600 22px/30px var(--font-sans);color:var(--text-primary)}\n.gi-pcard__ship{font:var(--type-small);color:var(--text-secondary);display:flex;align-items:center;gap:8px}\n.gi-pcard__foot{padding:16px;border-top:1px solid var(--border-default)}\n.gi-pcard.is-disabled .gi-pcard__name,.gi-pcard.is-disabled .gi-pcard__price{color:var(--text-disabled)}\n\n/* Panel (price summary) */\n.gi-panel{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:16px}\n.gi-panel--raised{border-color:transparent;box-shadow:var(--shadow-raised)}\n.gi-sum__row{display:flex;justify-content:space-between;gap:16px;font:var(--type-body);color:var(--text-primary)}\n.gi-sum__row span:first-child{color:var(--text-secondary)}\n.gi-sum__total{display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;border-top:1px solid var(--border-default)}\n.gi-badge-save{display:inline-flex;align-items:center;gap:6px;background:var(--feedback-success);color:var(--feedback-success-ink);font:var(--type-label);letter-spacing:var(--type-label-tracking);text-transform:uppercase;padding:4px 8px;border-radius:var(--radius)}\n\n/* Accordion */\n.gi-acc{border-top:1px solid var(--border-default)}\n.gi-acc__item{border-bottom:1px solid var(--border-default)}\n.gi-acc__btn{appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 8px;background:none;border:0;text-align:left;font:500 18px/26px var(--font-sans);color:var(--text-primary);cursor:pointer;border-radius:var(--radius)}\n.gi-acc__btn:hover,.gi-acc__btn.is-hover{color:var(--gi-navy)}\n.gi-acc__btn:active,.gi-acc__btn.is-pressed{background:var(--surface-tint)}\n.gi-acc__btn:focus-visible,.gi-acc__btn.is-focus{outline:var(--focus-width) solid var(--focus-ring);outline-offset:-2px}\n.gi-acc__btn:disabled{color:var(--text-disabled);cursor:not-allowed}\n.gi-acc__chev{transition:transform var(--dur) var(--ease);color:var(--gi-navy)}\n.gi-acc__btn[aria-expanded=\"true\"] .gi-acc__chev{transform:rotate(180deg)}\n.gi-acc__btn:disabled .gi-acc__chev{color:var(--text-disabled)}\n.gi-acc__panel{padding:0 8px 24px;font:var(--type-body);color:var(--text-secondary);max-width:72ch}\n\n/* Overlays */\n.gi-scrim{position:fixed;inset:0;background:var(--gi-scrim);z-index:100}\n.gi-scrim.is-inline{position:absolute}\n.gi-drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--drawer-width),100%);background:var(--gi-white);box-shadow:var(--shadow-raised);display:flex;flex-direction:column;z-index:101;animation:gi-drawer-in var(--dur-slow) var(--ease)}\n.gi-drawer.is-inline{position:absolute}\n@keyframes gi-drawer-in{from{transform:translateX(24px);opacity:0}}\n.gi-ov__head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 16px 16px 24px;border-bottom:1px solid var(--border-default)}\n.gi-ov__title{font:var(--type-h3);margin:0}\n.gi-ov__body{flex:1;overflow:auto;padding:24px}\n.gi-ov__foot{padding:24px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:12px}\n.gi-ov__busy{display:flex;align-items:center;justify-content:center;gap:12px;padding:48px 0;color:var(--text-secondary);font:var(--type-small)}\n.gi-ov__busy .gi-spinner{color:var(--gi-navy)}\n.gi-modal-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:101}\n.gi-modal-wrap.is-inline{position:absolute}\n.gi-modal{width:min(var(--modal-width),100%);max-height:100%;background:var(--gi-white);border-radius:var(--radius);box-shadow:var(--shadow-raised);display:flex;flex-direction:column;overflow:hidden;animation:gi-modal-in var(--dur) var(--ease)}\n@keyframes gi-modal-in{from{transform:translateY(8px);opacity:0}}\n.gi-modal .gi-ov__foot{flex-direction:row;justify-content:flex-end}\n\n/* Sticky mobile CTA */\n.gi-sticky{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--gi-white);border-top:1px solid var(--border-default);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:16px}\n.gi-sticky.is-inline{position:absolute}\n.gi-sticky__meta{display:flex;flex-direction:column;min-width:0;flex:1}\n.gi-sticky__meta b{font:600 18px/24px var(--font-sans)}\n.gi-sticky__meta span{font:var(--type-small);color:var(--text-secondary)}\n\n<\u002Fstyle>\n<script src=\"d29e50b6-ba9f-4b50-aa83-70e11d8a40ea\"><\u002Fscript>\n\n<style>\nbody{margin:0;background:#FFFFFF;font-family:'Kanit',sans-serif;color:#212934}\n*{box-sizing:border-box}\nbutton,input,select,textarea{font-family:inherit}\na{color:#004E7D;text-decoration:none}\na:hover{text-decoration:underline;text-underline-offset:3px}\nh1,h2,h3,p{margin:0}\nh1,h2,h3{text-wrap:balance}\np{text-wrap:pretty}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Kanit',sans-serif;color:#212934;background:#FFFFFF\">\n\n<!-- HERO -->\n<section data-screen-label=\"Intro\" style=\"background:#171D2D;color:#FFFFFF\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:72px 32px 0\">\n    <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2\">Case study<\u002Fspan>\n      <span style=\"width:4px;height:4px;border-radius:2px;background:#8A929E\"><\u002Fspan>\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2\">Global Industrial · /warehouse redesign<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-size:56px;line-height:64px;font-weight:600;max-width:900px\">Turning a warehouse catalog page into a business-account funnel<\u002Fh1>\n    <p style=\"font-size:18px;line-height:28px;color:#DADDE2;max-width:760px;margin-top:20px\">How I reframed a link-heavy category page around one action, created a business account, and used Restock Station to give that account a reason to exist.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:#424C5B;border:1px solid #424C5B;border-radius:8px;overflow:hidden;margin-top:40px\">\n      <sc-for list=\"{{ meta }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <div style=\"background:#171D2D;padding:20px 24px;display:flex;gap:14px;align-items:flex-start\">\n          <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ m.icon }}\" hint-size=\"24px,24px\" style=\"color:#FFFFFF;flex:none\"><\u002Fx-import>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2\">{{ m.k }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:24px;font-weight:500;color:#FFFFFF\">{{ m.v }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:48px;border-radius:8px 8px 0 0;overflow:hidden;border:1px solid #424C5B;border-bottom:none;background:#FFFFFF\">\n      <div style=\"height:32px;background:#F3F3F3;border-bottom:1px solid #DADDE2;display:flex;align-items:center;gap:8px;padding:0 14px\">\n        <span style=\"width:10px;height:10px;border-radius:5px;background:#DADDE2\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:5px;background:#DADDE2\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:5px;background:#DADDE2\"><\u002Fspan>\n        <span style=\"margin-left:12px;font-size:12px;line-height:16px;color:#424C5B\">globalindustrial.com/warehouse<\u002Fspan>\n      <\u002Fdiv>\n      <img src=\"8e432807-f208-47d1-90c0-b877cfc56fe8\" alt=\"Final hi-fi warehouse landing page, first screen\" style=\"width:100%;display:block\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 1 PROBLEM -->\n<section data-screen-label=\"Problem\" style=\"max-width:1200px;margin:0 auto;padding:96px 32px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">Problem and business context<\u002Fspan>\n      <h2 style=\"font-size:36px;line-height:44px;font-weight:600\">The page sold products. The business needed accounts.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:28px;color:#424C5B\">The live /warehouse page worked like a catalog: categories, workspaces and more than 100 links, with no reason to sign up. A business account is what turns a one-off buyer into repeat revenue, especially through Restock Station Auto-Reorder.<\u002Fp>\n      <p style=\"font-size:16px;line-height:26px;color:#424C5B\">I framed the brief as a product question first: what has to be true for a warehouse leader to create an account on their first visit? Visual design came second.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <sc-for list=\"{{ framing }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:16px;align-items:flex-start;border:1px solid #DADDE2;border-radius:8px;padding:20px 24px\">\n          <span style=\"width:48px;height:48px;flex:none;border-radius:8px;background:#E5EEF4;color:#004E7D;display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ f.icon }}\" hint-size=\"24px,24px\"><\u002Fx-import><\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">{{ f.k }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:26px;color:#212934\">{{ f.v }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:56px;background:#F6FBFF;border:1px solid #DADDE2;border-radius:8px;padding:32px\">\n    <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">The shift I designed for<\u002Fspan>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:20px;align-items:stretch\">\n      <sc-for list=\"{{ shift }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"position:relative;background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between\">\n            <span style=\"width:44px;height:44px;border-radius:8px;background:#004E7D;color:#FFFFFF;display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ s.icon }}\" hint-size=\"24px,24px\"><\u002Fx-import><\u002Fspan>\n            <sc-if value=\"{{ s.arrow }}\" hint-placeholder-val=\"{{ true }}\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"arrow-right\" hint-size=\"24px,24px\" style=\"color:#8A929E\"><\u002Fx-import><\u002Fsc-if>\n          <\u002Fdiv>\n          <span style=\"font-size:18px;line-height:26px;font-weight:600\">{{ s.t }}<\u002Fspan>\n          <span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ s.d }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- RESEARCH -->\n<section data-screen-label=\"Research\" style=\"background:#F6FBFF;border-top:1px solid #DADDE2\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:720px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">Research<\u002Fspan>\n        <h2 style=\"font-size:36px;line-height:44px;font-weight:600\">I didn't have access to customers, so the live page and the market became my first participants.<\u002Fh2>\n        <p style=\"font-size:18px;line-height:28px;color:#424C5B\">What this told me: competitors already sell \"never run out\", but mostly through reps or consumer-style subscriptions. A self-serve, warehouse-specific version was the gap.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\" role=\"tablist\" aria-label=\"Research views\">\n        <sc-for list=\"{{ rTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Chip\" selected=\"{{ t.selected }}\" sc-camel-on-click=\"{{ t.select }}\" icon=\"{{ t.icon }}\" hint-size=\"140px,40px\">{{ t.label }}<\u002Fx-import>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ rMethods }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:40px;display:flex;flex-direction:column;gap:32px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px\">\n          <sc-for list=\"{{ methodsUsed }}\" as=\"m\" hint-placeholder-count=\"5\">\n            <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                <span style=\"width:44px;height:44px;border-radius:8px;background:#004E7D;color:#FFFFFF;display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ m.icon }}\" hint-size=\"24px,24px\"><\u002Fx-import><\u002Fspan>\n                <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;background:#71B946;color:#212934;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase\">Used<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ m.t }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ m.d }}<\u002Fspan>\n              <span style=\"display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:20px;font-weight:500;color:#004E7D;margin-top:auto;border-top:1px solid #DADDE2;padding-top:12px\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"corner-down-right\" size=\"{{ 16 }}\" hint-size=\"16px,16px\" style=\"flex:none;margin-top:2px\"><\u002Fx-import>{{ m.out }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:28px\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:24px\">\n            <span style=\"font-size:18px;line-height:26px;font-weight:600;white-space:nowrap\">Research I'd run next<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;border:1px solid #8A929E;background:#F3F3F3;color:#212934;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase\">Planned<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0\">\n            <sc-for list=\"{{ methodsPlanned }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;flex-direction:column;gap:16px;padding:0 24px 0 0\">\n                <div style=\"display:flex;align-items:center;gap:0\">\n                  <span style=\"width:36px;height:36px;flex:none;border-radius:18px;background:#004E7D;color:#FFFFFF;display:flex .Icon\" name=\"{{ s.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\" style=\"color:#004E7D;flex:none;margin-top:1px\"><\u002Fx-import><span style=\"font-size:14px;line-height:22px;color:#212934\">{{ s.t }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n            <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Two buying moments<\u002Fspan>\n            <sc-for list=\"{{ moments }}\" as=\"m\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:12px;align-items:center;border:1px solid #DADDE2;border-radius:8px;padding:12px\">\n                <span style=\"width:40px;height:40px;flex:none;border-radius:8px;background:{{ m.bg }};color:#FFFFFF;display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ m.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fspan>\n                <div style=\"display:flex;flex-direction:column\"><span style=\"font-size:14px;line-height:22px;font-weight:600\">{{ m.t }}<\u002Fspan><span style=\"font-size:14px;line-height:20px;color:#424C5B\">{{ m.d }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"font-size:14px;line-height:22px;color:#424C5B\">Built from the brief and the audit, to validate with the planned interviews.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 2 AUDIT -->\n<section data-screen-label=\"Audit\" style=\"background:#FFFFFF;border-top:1px solid #DADDE2\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:760px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">Audit of the live page<\u002Fspan>\n      <h2 style=\"font-size:36px;line-height:44px;font-weight:600\">Eight findings, one pattern: nothing asked for the account.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:28px;color:#424C5B\">I walked the live page as a warehouse operations manager and tagged every issue against the account goal. Seven were problems; one was a strength worth protecting.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px;margin-top:48px;align-items:start\">\n      <div style=\"background:#F6FBFF;border:1px solid #DADDE2;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B;margin-bottom:8px\">Live page map<\u002Fspan>\n        <sc-for list=\"{{ pageMap }}\" as=\"b\" hint-placeholder-count=\"8\">\n          <sc-if value=\"{{ b.hot }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;height:{{ b.h }};border:2px solid #D41E3D;border-radius:8px;padding:0 12px;background:#FFFFFF\">\n              <span style=\"font-size:14px;line-height:20px;font-weight:600;color:#212934\">{{ b.t }}<\u002Fspan>\n              <span style=\"font-size:12px;line-height:16px;font-weight:500;color:#D41E3D\">{{ b.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.cool }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;height:{{ b.h }};border:1px solid #DADDE2;border-radius:8px;padding:0 12px;background:#F3F3F3\">\n              <span style=\"font-size:14px;line-height:20px;color:#424C5B\">{{ b.t }}<\u002Fspan>\n              <span style=\"font-size:12px;line-height:16px;color:#424C5B\">{{ b.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n        <span style=\"font-size:14px;line-height:22px;color:#424C5B;margin-top:8px\">Restock Station, the feature most tied to repeat orders, sat as one of eight cards near the bottom.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n        <sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n              <span style=\"width:40px;height:40px;border-radius:8px;background:#E5EEF4;color:#004E7D;display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ f.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fspan>\n              <sc-if value=\"{{ f.isStrength }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;background:#71B946;color:#212934;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase\">Keep<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ f.isHigh }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;background:#D41E3D;color:#FFFFFF;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase\">High<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ f.isMed }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;border:1px solid #8A929E;background:#F3F3F3;color:#212934;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase\">Medium<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ f.t }}<\u002Fspan>\n            <span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ f.d }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"Journey\" style=\"margin-top:72px;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;max-width:720px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">Journey map<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:8px;border:1px solid #8A929E;background:#F3F3F3;color:#212934;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap\">Assumption-based<\u002Fspan><\u002Fdiv>\n          <h3 style=\"font-size:28px;line-height:36px;font-weight:600\">The visit peaked on arrival and fell from there.<\u002Fh3>\n          <p style=\"font-size:16px;line-height:26px;color:#424C5B\">What this told me: the drop happens at \"decide\" and never recovers, because nothing brings the buyer back next week.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px\" role=\"group\" aria-label=\"Journey view\">\n          <sc-for list=\"{{ jTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Chip\" selected=\"{{ t.selected }}\" sc-camel-on-click=\"{{ t.select }}\" icon=\"{{ t.icon }}\" hint-size=\"120px,40px\">{{ t.label }}<\u002Fx-import>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #DADDE2;border-radius:8px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:140px repeat(5,minmax(0,1fr));background:#171D2D;color:#FFFFFF\">\n          <span style=\"padding:16px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2;display:flex;align-items:center\">Stage<\u002Fspan>\n          <sc-for list=\"{{ jStages }}\" as=\"st\" hint-placeholder-count=\"5\">\n            <div style=\"padding:16px;border-left:1px solid #424C5B;display:flex;gap:10px;align-items:center\">\n              <span style=\"width:32px;height:32px;flex:none;border-radius:8px;background:#004E7D;display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ st.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import><\u002Fspan>\n              <span style=\"font-size:15px;line-height:20px;font-weight:600\">{{ st.t }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ jLanes }}\" as=\"l\" hint-placeholder-count=\"2\">\n          <div style=\"display:grid;grid-template-columns:140px repeat(5,minmax(0,1fr));border-top:1px solid #DADDE2\">\n            <span style=\"padding:16px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B;background:#F6FBFF\">{{ l.label }}<\u002Fspan>\n            <sc-for list=\"{{ l.cells }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <span style=\"padding:16px;border-left:1px solid #DADDE2;font-size:14px;line-height:22px;color:#212934\">{{ c }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:grid;grid-template-columns:140px minmax(0,1fr);border-top:1px solid #DADDE2\">\n          <span style=\"padding:16px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B;background:#F6FBFF\">Feeling<\u002Fspan>\n          <div style=\"position:relative;height:140px\">\n            <svg sc-camel-view-box=\"0 0 500 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:16px 0;width:100%;height:calc(100% - 32px);overflow:visible\" aria-hidden=\"true\">\n              <line x1=\"0\" y1=\"50\" x2=\"500\" y2=\"50\" stroke=\"#DADDE2\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\" stroke-dasharray=\"4 4\"><\u002Fline>\n              <polyline points=\"{{ jLine }}\" fill=\"none\" stroke=\"{{ jStroke }}\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"transition:all 480ms cubic-bezier(.2,0,0,1)\"><\u002Fpolyline>\n            <\u002Fsvg>\n            <sc-for list=\"{{ jDots }}\" as=\"d\" hint-placeholder-count=\"0\">\n              <div style=\"position:absolute;left:{{ d.x }};top:{{ d.y }};transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;transition:top 480ms cubic-bezier(.2,0,0,1)\">\n                <span style=\"width:16px;height:16px;border-radius:8px;background:{{ d.bg }};border:3px solid #FFFFFF;box-shadow:0 0 0 1px {{ d.bg }}\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <span style=\"position:absolute;right:8px;top:8px;font-size:12px;line-height:16px;color:#424C5B\">Confident<\u002Fspan>\n            <span style=\"position:absolute;right:8px;bottom:8px;font-size:12px;line-height:16px;color:#424C5B\">Frustrated<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:140px repeat(5,minmax(0,1fr));border-top:1px solid #DADDE2\">\n          <span style=\"padding:16px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B;background:#F6FBFF\">{{ jOutcomeLabel }}<\u002Fspan>\n          <sc-for list=\"{{ jOutcomes }}\" as=\"o\" hint-placeholder-count=\"5\">\n            <div style=\"padding:16px;border-left:1px solid #DADDE2;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:22px;font-weight:500;color:#212934\"><span style=\"width:24px;height:24px;flex:none;border-radius:6px;background:{{ o.chip }};color:{{ o.fg }};display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ o.icon }}\" size=\"{{ 16 }}\" hint-size=\"16px,16px\"><\u002Fx-import><\u002Fspan>{{ o.t }}<\u002Fspan>\n              <span style=\"font-size:12px;line-height:16px;font-weight:500;color:#424C5B\">{{ o.ref }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3 STRATEGY -->\n<section data-screen-label=\"Strategy\" style=\"max-width:1200px;margin:0 auto;padding:96px 32px\">\n  <div style=\"display:flex;flex-direction:column;gap:16px;max-width:760px\">\n    <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">Strategy decisions and trade-offs<\u002Fspan>\n    <h2 style=\"font-size:36px;line-height:44px;font-weight:600\">Every visitor gets a path. Only one path gets the red button.<\u002Fh2>\n    <p style=\"font-size:18px;line-height:28px;color:#424C5B\">I started from visitor intent, not layout. Three kinds of visitor land on this page, and each needed a clear next step without competing with the account goal.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:48px;border:1px solid #DADDE2;border-radius:8px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:0\">\n    <div style=\"display:flex;align-items:center;gap:12px;background:#171D2D;color:#FFFFFF;border-radius:8px;padding:14px 24px\">\n      <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"users\" hint-size=\"24px,24px\"><\u002Fx-import>\n      <span style=\"font-size:18px;line-height:26px;font-weight:600\">Warehouse leader lands on /warehouse<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"width:2px;height:28px;background:#8A929E\"><\u002Fdiv>\n    <div style=\"width:min(100%,780px);height:2px;background:#8A929E\"><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;width:100%;max-width:1000px\">\n      <sc-for list=\"{{ intents }}\" as=\"i\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;align-items:center\">\n          <div style=\"width:2px;height:28px;background:#8A929E\"><\u002Fdiv>\n          <div style=\"width:100%;border:1px solid #DADDE2;border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px;background:#FFFFFF\">\n            <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">{{ i.intent }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ i.q }}<\u002Fspan>\n            <sc-if value=\"{{ i.primary }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"display:flex;align-items:center;gap:8px;background:#D41E3D;color:#FFFFFF;border-radius:8px;padding:10px 14px;font-size:14px;line-height:20px;font-weight:500\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ i.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import>{{ i.path }}<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ i.secondary }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"display:flex;align-items:center;gap:8px;border:1px solid #004E7D;color:#004E7D;border-radius:8px;padding:9px 14px;font-size:14px;line-height:20px;font-weight:500\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ i.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import>{{ i.path }}<\u002Fspan>\n            <\u002Fsc-if>\n            <span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ i.where }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:48px\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:24px;padding:0 24px 8px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Decision<\u002Fspan>\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Why<\u002Fspan>\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Trade-off I accepted<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"5\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:24px;border:1px solid #DADDE2;border-radius:8px;padding:20px 24px;align-items:start\">\n        <div style=\"display:flex;gap:12px;align-items:flex-start\">\n          <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ d.icon }}\" hint-size=\"24px,24px\" style=\"color:#004E7D;flex:none\"><\u002Fx-import>\n          <span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ d.t }}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;line-height:22px;color:#212934\">{{ d.why }}<\u002Fspan>\n        <span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ d.cost }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 4 FUNNEL -->\n<section data-screen-label=\"Funnel\" style=\"background:#171D2D;color:#FFFFFF\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:760px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2\">Offer and funnel logic<\u002Fspan>\n      <h2 style=\"font-size:36px;line-height:44px;font-weight:600\">The 20% isn't a discount. It's the first Auto-Reorder.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:28px;color:#DADDE2\">I tied the offer to Pack &amp; Ship because tape, wrap and boxes are bought every week. A first discounted order on Auto-Reorder is the step most likely to become a habit, which is what the account is really for.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:48px;align-items:end\">\n      <sc-for list=\"{{ funnel }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"width:32px;height:32px;border-radius:8px;background:#FFFFFF;color:#171D2D;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600\">{{ f.n }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ f.t }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:{{ f.h }};background:{{ f.bg }};border-radius:8px;display:flex;align-items:flex-end;padding:16px;color:#FFFFFF\">\n            <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ f.icon }}\" size=\"{{ 32 }}\" hint-size=\"32px,32px\"><\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px\">\n      <sc-for list=\"{{ funnel }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"border:1px solid #424C5B;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2\">On the page<\u002Fspan>\n          <span style=\"font-size:14px;line-height:22px;color:#FFFFFF\">{{ f.page }}<\u002Fspan>\n          <span style=\"height:1px;background:#424C5B\"><\u002Fspan>\n          <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2\">Proposed metric<\u002Fspan>\n          <span style=\"font-size:14px;line-height:22px;font-weight:500;color:#FFFFFF\">{{ f.metric }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:40px\">\n      <sc-for list=\"{{ offerRules }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:14px;align-items:flex-start;background:#212934;border-radius:8px;padding:20px\">\n          <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"{{ r.icon }}\" hint-size=\"24px,24px\" style=\"color:#FFFFFF;flex:none\"><\u002Fx-import>\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ r.t }}<\u002Fspan><span style=\"font-size:14px;line-height:22px;color:#DADDE2\">{{ r.d }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- IA -->\n<section data-screen-label=\"IA\" style=\"max-width:1200px;margin:0 auto;paddin idth:10px;height:10px;border-radius:5px;background:{{ a.dot }}\"><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:16px;padding-top:28px\">\n      <div style=\"background:#171D2D;color:#FFFFFF;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px;min-height:220px\">\n        <span style=\"display:inline-flex;align-self:flex-start;align-items:center;height:24px;padding:0 8px;border-radius:8px;background:{{ iaSel.dot }};color:{{ iaSel.dotFg }};font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase\">{{ iaSel.status }}<\u002Fspan>\n        <span style=\"font-size:22px;line-height:30px;font-weight:600\">{{ iaSel.n }} · {{ iaSel.t }}<\u002Fspan>\n        <span style=\"font-size:15px;line-height:24px;color:#DADDE2\">{{ iaSel.why }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 16px;font-size:13px;line-height:18px;color:#424C5B\">\n        <sc-for list=\"{{ iaLegend }}\" as=\"l\" hint-placeholder-count=\"4\">\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:5px;background:{{ l.c }}\"><\u002Fspan>{{ l.t }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font-size:14px;line-height:22px;color:#424C5B\">Hover or tab through the redesign list to see why each section sits where it does.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:48px;background:#F6FBFF;border:1px solid #DADDE2;border-radius:8px;padding:28px\">\n    <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Navigation model: three ways in, one shelf<\u002Fspan>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr) 48px minmax(0,1fr);gap:12px;align-items:center;ma ;gap:10px\">\n        <div style=\"display:flex;gap:12px;align-items:center;background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:12px 14px\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"shopping-cart\" size=\"{{ 20 }}\" hint-size=\"20px,20px\" style=\"color:#004E7D\"><\u002Fx-import><span style=\"font-size:14px;line-height:22px;font-weight:600\">Add to cart<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:center;background:#D41E3D;color:#FFFFFF;border-radius:8px;padding:12px 14px\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"repeat\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import><span style=\"font-size:14px;line-height:22px;font-weight:600\">Put it on Auto-Reorder<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 5 WIREFRAME TO HI-FI -->\n<section data-screen-label=\"Evolution\" style=\"max-width:1200px;margin:0 auto;padding:96px 32px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:720px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">Wireframes to hi-fi<\u002Fspan>\n      <h2 style=\"font-size:36px;line-height:44px;font-weight:600\">I settled hierarchy in greyscale, then let the brand in.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:28px;color:#424C5B\">The wireframes had one job: prove that the account button wins the first screen with no colour to help it. Once it did, the hi-fi kept the structure and changed the presentation.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\" role=\"group\" aria-label=\"Choose a comparison\">\n      <sc-for list=\"{{ evoTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n };top:{{ p.y }};transform:translate(-50%,-50%);width:32px;height:32px;border-radius:16px;border:2px solid #FFFFFF;background:{{ p.bg }};color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\">{{ p.n }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px\">\n    <sc-for list=\"{{ evo.notes }}\" as=\"n\" hint-placeholder-count=\"4\">\n      <sc-if value=\"{{ n.active }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ n.select }}\" style=\"text-align:left;display:flex;gap:12px;align-items:flex-start;border:1px solid #004E7D;box-shadow:inset 0 0 0 1px #004E7D;background:#F6FBFF;border-radius:8px;padding:16px;cursor:pointer;color:#212934\">\n          <span style=\"width:28px;height:28px;flex:none;border-radius:14px;background:#D41E3D;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600\">{{ n.n }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ n.t }}<\u002Fspan><span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ n.d }}<\u002Fspan><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ n.inactive }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ n.select }}\" style=\"text-align:left;display:flex;gap:12px;align-items:flex-start;border:1px solid #DADDE2;background:#FFFFFF;border-radius:8px;padding:16px;cursor:pointer;color:#212934\" style-hover=\"box-shadow:var(--shadow-raised)\">\n          <span style=\"width:28px;height:28px;flex:none;border-radius:14px;background:#004E7D;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600\">{{ n.n }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ n.t }}<\u002Fspan><span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ n.d }}<\u002Fspan><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 6 DESIGN SYSTEM -->\n<section data-screen-label=\"Design system\" style=\"background:#F6FBFF;border-top:1px solid #DADDE2\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 32px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:760px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">Design system and accessibility<\u002Fspan>\n      <h2 style=\"font-size:36px;line-height:44px;font-weight:600\">Match the live brand, tidy it, and keep it readable.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:28px;color:#424C5B\">I built every section from the Global Industrial system: its components, its 8px radius, Kanit throughout and one shadow. Colour had a job, not a mood.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;margin-top:48px\">\n      <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Colour roles<\u002Fspan>\n        <sc-for list=\"{{ swatches }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;gap:14px\">\n            <span style=\"width:44px;height:44px;flex:none;border-radius:8px;background:{{ s.hex }};border:1px solid #DADDE2\"><\u002Fspan>\n            <div style=\"display:flex;flex-direction:column\"><span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ s.name }}<\u002Fspan><span style=\"font-size:14px;line-height:20px;color:#424C5B\">{{ s.role }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Kanit, one family<\u002Fspan>\n        <span style=\"font-size:56px;line-height:64px;font-weight:600\">Aa<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid #DADDE2;padding-top:16px\">\n          <span style=\"font-size:36px;line-height:44px;font-weight:600\">Heading 36<\u002Fspan>\n          <span style=\"font-size:22px;line-height:30px;font-weight:500\">Subhead 22<\u002Fspan>\n          <span style=\"font-size:16px;line-height:26px\">Body 16, plain and specific<\u002Fspan>\n          <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#004E7D\">Label 12 uppercase<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Components I reused<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n          <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Button\" variant=\"primary\" icon=\"building-2\" hint-size=\"260px,48px\">Create Business Account<\u002Fx-import>\n          <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Button\" variant=\"secondary\" icon-right=\"chevron-right\" hint-size=\"220px,48px\">Talk to a Specialist<\u002Fx-import>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Chip\" selected=\"{{ true }}\" icon=\"package-check\" hint-size=\"150px,40px\">Packing<\u002Fx-import>\n            <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Chip\" icon=\"truck\" hint-size=\"130px,40px\">Receiving<\u002Fx-import>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.QuantityStepper\" value=\"{{ qty }}\" sc-camel-on-change=\"{{ setQty }}\" label=\"Quantity example\" hint-size=\"128px,48px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;line-height:22px;color:#424C5B\">Also: Accordion, TextLink, Icon, ProductCard patterns. No custom look-alikes.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:24px;margin-top:24px\">\n      <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Accessibility checks<\u002Fspan>\n        <sc-for list=\"{{ a11y }}\" as=\"a\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start\">\n            <span style=\"width:28px;height:28px;flex:none;border-radius:8px;background:#71B946;color:#212934;display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"check\" size=\"{{ 16 }}\" hint-size=\"16px,16px\"><\u002Fx-import><\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:2px;flex:1\"><span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ a.t }}<\u002Fspan><span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ a.d }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF;border:1px solid #DADDE2;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#424C5B\">Where I broke the rules, and why<\u002Fspan>\n        <sc-for list=\"{{ exceptions }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start\">\n            <span style=\"width:28px;height:28px;flex:none;border-radius:8px;background:#F3F3F3;border:1px solid #8A929E;color:#212934;display:flex;align-items:center;justify-content:center\"><x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"circle-alert\" size=\"{{ 16 }}\" hint-size=\"16px,16px\"><\u002Fx-import><\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:2px;flex:1\"><span style=\"font-size:16px;line-height:24px;font-weight:600\">{{ e.t }}<\u002Fspan><span style=\"font-size:14px;line-height:22px;color:#424C5B\">{{ e.d }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CLOSING -->\n<section data-screen-label=\"Next\" style=\"background:#171D2D;color:#FFFFFF\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:72px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2\">What I'd validate next<\u002Fspan>\n      <h2 style=\"font-size:36px;line-height:44px;font-weight:600\">Ship it as a test, not a launch.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:28px;color:#DADDE2\">The design is a hypothesis: an offer tied to Auto-Reorder will create more accounts that actually reorder. The next step is an A/B test against the live page, measured on the funnel above.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#DADDE2\">Open questions for Global Industrial<\u002Fspan>\n      <sc-for list=\"{{ openQs }}\" as=\"q\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #424C5B;padding-bottom:12px\">\n          <x-import component-from-global-scope=\"GlobalIndustrialDesignSystem_521f1f.Icon\" name=\"circle-help\" size=\"{{ 20 }}\" hint-size=\"20px,20px\" style=\"color:#FFFFFF;flex:none;margin-top:2px\"><\u002Fx-import>\n          <span style=\"font-size:16px;line-height:24px;color:#FFFFFF\">{{ q }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst A = u => { const el = document.querySelector('meta[name=\"ext-resource-dependency\"][content=\"' + u + '\"]'); const r = el && window.__resources && window.__resources[el.dataset.resourceId]; return r || u; };\nconst EVO = {\n  hero: {\n    wf: A('cs-assets/wf-d1.jpg'), wfLabel: 'D1 · hero layout A, greyscale',\n    hf: A('cs-assets/hifi-hero.jpg'), hfLabel: 'Final first screen',\n    notes: [\n      { x: '9%', y: '21%', t: 'Offer leads the page', d: 'The promo bar states the 20% and its condition before anything else, so the hero can stay about the job.' },\n      { x: '14%', y: '93%', t: 'One account action wins', d: 'Create Business Account is the strongest element in both versions. Greyscale proved it before colour helped.' },\n      { x: '32%', y: '93%', t: 'Sales is always one
